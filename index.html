<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip-Calculator</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header"><h2>Tip Calculator</h2></div>
      <div class="main">
        <p>Enter the bill amount and tip percentage to calculate the total.</p>
        <div class="bill-amount">
          <label for="bill">Bill amount:</label><br />
          <input type="text" name="bill" id="amount" />
        </div>
        <div class="tip-percentage">
          <label for="tip">Tip percentage:</label><br />
          <input type="text" name="tip" id="tip-percentage" />
        </div>
        <div class="calculate">
          <button class="btn-calculate" id="calculate">Calculate</button>
        </div>
        <div class="total">
          <p>Total: <span id="total"></span></p>
        </div>
      </div>
    </div>
    <!-- javascript -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="assets/js/index.js"></script>
  </body>
</html>
